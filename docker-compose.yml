# Etapa 5: três nós independentes da SatusBlockchain, um container cada.
#
#   docker compose up --build -d     # sobe os 3 (builda a imagem se necessário)
#   docker compose ps                # estado, saúde e portas
#   docker compose logs -f node1     # log de um nó
#   docker compose down              # derruba tudo
#
# Dificuldade do PoW: os containers usam NODE_DIFFICULTY do ambiente, com padrão 4
# (~1s por bloco — dá para acompanhar a propagação da etapa 6 acontecendo).
# Para voltar a uma mineração instantânea (útil em teste manual rápido):
#   $env:NODE_DIFFICULTY = "2"; docker compose up -d --force-recreate
# O nome é diferente de DIFFICULTY de propósito: o README manda usar $env:DIFFICULTY
# para o `dotnet run`, e uma variável "esquecida" no shell mudaria a dificuldade dos
# containers sem querer (foi exatamente o que aconteceu durante os testes da etapa 5:
# os nós subiram com dificuldade 6, herdada de um teste anterior de PoW).
#
# PRÉ-REQUISITO da propagação: os TRÊS nós precisam da MESMA dificuldade. O genesis é
# minerado na dificuldade do nó, então genesis(dif=4) != genesis(dif=2) e um bloco
# minerado com 2 zeros não satisfaz o PoW de quem exige 4 — o peer recusaria tudo.
# Por isso os três serviços usam a MESMA variável ${NODE_DIFFICULTY:-4}.
#
# Rede interna: cada nó é resolvido pelo NOME DO SERVIÇO
#   http://node1:8080   http://node2:8080   http://node3:8080
# É esse endereço que a Etapa 6 usa como peer (PEERS).
# Do host, o acesso é por localhost:8080 (node1), :8081 (node2), :8082 (node3).
#
# Os três serviços são idênticos exceto por NODE_ID e pela porta publicada no
# host: é a mesma imagem rodando 3 vezes, com estado em memória separado.
#
# Etapa 10 (nós em tempo de execução): node1..node3 são as SEMENTES — sobem com o
# compose e aceitam quem se anuncia a eles. Nós novos entram e saem com o sistema no ar:
#   .\scripts\add-node.ps1 node4 -HostPort 8083     # entra (molde node-extra, abaixo)
#   .\scripts\remove-node.ps1 node4                 # sai se despedindo (docker stop)
#   .\scripts\remove-node.ps1 node4 -Crash          # cai sem avisar (docker kill)

name: satusblockchain

services:
  node1:
    build:
      context: .
      dockerfile: src/SatusBlockchain.Node/Dockerfile
    image: satus-node:local
    container_name: node1
    environment:
      NODE_ID: node1
      # Peers deste nó (endereço INTERNO do Docker): os outros dois.
      PEERS: "http://node2:8080,http://node3:8080"
      # NODE_DIFFICULTY (padrão 4 = ~1s por bloco); nome próprio para não herdar
      # a variável DIFFICULTY usada pelo `dotnet run` no mesmo shell.
      DIFFICULTY: "${NODE_DIFFICULTY:-4}"
    ports:
      - "8080:8080"
    networks:
      - satus-net
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: src/SatusBlockchain.Node/Dockerfile
    image: satus-node:local
    container_name: node2
    environment:
      NODE_ID: node2
      PEERS: "http://node1:8080,http://node3:8080"
      DIFFICULTY: "${NODE_DIFFICULTY:-4}"
    ports:
      - "8081:8080"
    networks:
      - satus-net
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: src/SatusBlockchain.Node/Dockerfile
    image: satus-node:local
    container_name: node3
    environment:
      NODE_ID: node3
      PEERS: "http://node1:8080,http://node2:8080"
      DIFFICULTY: "${NODE_DIFFICULTY:-4}"
    ports:
      - "8082:8080"
    networks:
      - satus-net
    restart: unless-stopped

  # Etapa 10: MOLDE dos nós que entram com o sistema rodando — não é um nó por si só.
  # O profile "extra" impede que `docker compose up` o suba; cada nó novo é um container
  # criado pelo scripts/add-node.ps1 com `docker compose run --name nodeN ... node-extra`,
  # que acrescenta NODE_ID e ADVERTISE_URL próprios. Herdar daqui garante a mesma imagem,
  # a mesma rede e — o mais importante — a MESMA dificuldade dos outros nós.
  node-extra:
    profiles: ["extra"]
    build:
      context: .
      dockerfile: src/SatusBlockchain.Node/Dockerfile
    image: satus-node:local
    environment:
      # A semente: basta UM nó conhecido — o resto da rede vem na resposta do anúncio.
      PEERS: "http://node1:8080"
      DIFFICULTY: "${NODE_DIFFICULTY:-4}"
    networks:
      - satus-net

networks:
  satus-net:
    driver: bridge
